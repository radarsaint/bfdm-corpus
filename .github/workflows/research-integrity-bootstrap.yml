name: Bootstrap first-tranche integrity packet

on:
  push:
    branches:
      - audit/derived-research-integrity-2026-10-05
    paths:
      - "scripts/build_research_review_packet.py"
      - "scripts/validate_research_evidence.py"
      - ".github/workflows/research-integrity-bootstrap.yml"
      - "research/roanoke-s3/decision-cases-v1.md"
      - "research/roanoke-s3/decision-cases-v1.jsonl"
      - "research/roanoke-s3/README.md"
      - "research/INDEX.md"
      - "research/integrity/README.md"
      - "research/integrity/audit_ledger.jsonl"
      - "research/integrity/generated/roanoke-s3-decision-cases-v1.review.md"

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/derived-research-integrity-2026-10-05
          fetch-depth: 0
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile integrity tooling
        run: python -m py_compile scripts/validate_research_evidence.py scripts/build_research_review_packet.py
      - name: Validate the reviewed tranche
        run: |
          python scripts/validate_research_evidence.py
          python scripts/build_research_review_packet.py --check
