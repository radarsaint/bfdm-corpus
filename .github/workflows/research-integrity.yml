name: Validate derived-research integrity

on:
  pull_request:
    paths:
      - "research/roanoke-s3/**"
      - "research/integrity/**"
      - "research/INDEX.md"
      - "research/METHOD.md"
      - "scripts/validate_research_evidence.py"
      - "scripts/build_research_review_packet.py"
      - "scripts/test_integrity_revalidation.py"
      - "sources/roanoke/BCS-000045/**"
      - "discord/roanoke-season-3/**"
      - "model-index/discord/roanoke-season-3/**"
      - "registry/identities.jsonl"
      - ".github/workflows/research-integrity.yml"
  push:
    branches:
      - main
    paths:
      - "research/roanoke-s3/**"
      - "research/integrity/**"
      - "research/INDEX.md"
      - "research/METHOD.md"
      - "scripts/validate_research_evidence.py"
      - "scripts/build_research_review_packet.py"
      - "scripts/test_integrity_revalidation.py"
      - "sources/roanoke/BCS-000045/**"
      - "discord/roanoke-season-3/**"
      - "model-index/discord/roanoke-season-3/**"
      - "registry/identities.jsonl"
      - ".github/workflows/research-integrity.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile integrity tooling
        run: python -m py_compile scripts/validate_research_evidence.py scripts/build_research_review_packet.py scripts/test_integrity_revalidation.py
      - name: Validate the revision under test
        run: |
          python scripts/validate_research_evidence.py
          python scripts/build_research_review_packet.py --check
          python scripts/test_integrity_revalidation.py
