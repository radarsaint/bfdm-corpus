name: Validate Season 5 corpus integration

on:
  push:
    branches:
      - integrate/season5-corpus-v1
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integrate/season5-corpus-v1
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate registries
        run: python registry/validate_registry.py
      - name: Validate ingestion
        run: python ingest/validate_ingest.py
      - name: Verify Season 5 canonical mapping
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[json.loads(x) for x in Path("evidence/catalog.jsonl").read_text().splitlines() if x.strip()]
          ids={r["corpus_id"] for r in rows}
          expected={f"BCS-{i:06d}" for i in range(87,115)}
          missing=sorted(expected-ids)
          if missing:
              raise SystemExit(f"missing S5 BCS IDs: {missing}")
          metas=list(Path("sources/roanoke-s5-legends/google-sites").glob("*/metadata.json"))
          caps=list(Path("sources/roanoke-s5-legends/google-sites").glob("*/capture.json"))
          if len(metas)!=26 or len(caps)!=26:
              raise SystemExit(f"expected 26 metadata + capture files, got {len(metas)} and {len(caps)}")
          for p in metas:
              m=json.loads(p.read_text())
              if m.get("schema_version")!="bfdm_source_metadata/v1":
                  raise SystemExit(f"noncanonical metadata: {p}")
          print("Season 5 mapping OK: 26 Sites + 2 Drive bridges")
          PY
