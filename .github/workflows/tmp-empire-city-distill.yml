name: Temporary Empire City SQLite Extract

on:
  push:
    branches:
      - analysis/empire-city-distill
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    env:
      GIT_LFS_SKIP_SMUDGE: "1"
    steps:
      - name: Checkout corpus without bulk LFS hydration
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1

      - name: Fetch only Empire City SQLite
        shell: bash
        run: |
          git lfs install --local
          git lfs pull --include="discord/empire-city/empire-city.sqlite" --exclude=""
          ls -lh discord/empire-city/empire-city.sqlite

      - name: Verify Empire City database
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("discord/empire-city/empire-city.sqlite")
          b=p.read_bytes()[:16]
          if b != b"SQLite format 3\x00":
              raise SystemExit(f"Database is not materialized SQLite; header={b!r}")
          print("Empire City SQLite materialized correctly.")
          PY

      - name: Package database
        run: |
          cp discord/empire-city/empire-city.sqlite empire-city.sqlite
          sha256sum empire-city.sqlite > empire-city.sqlite.sha256
          ls -lh empire-city.sqlite empire-city.sqlite.sha256

      - name: Upload private analysis artifact
        uses: actions/upload-artifact@v4
        with:
          name: empire-city-sqlite
          path: |
            empire-city.sqlite
            empire-city.sqlite.sha256
          retention-days: 2
