name: Build model-readable Discord projection

on:
  workflow_dispatch:
    inputs:
      server_slug:
        description: Discord server directory slug
        required: true
        default: roanoke-season-3
  push:
    branches: [main]
    paths:
      - 'discord/**.sqlite'
      - 'scripts/export_discord_model_view.py'

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
      - name: Pull LFS payloads
        run: git lfs pull
      - name: Export projection
        env:
          SLUG: ${{ inputs.server_slug || 'roanoke-season-3' }}
        run: |
          python scripts/export_discord_model_view.py "discord/$SLUG/$SLUG.sqlite" --out "model/discord/$SLUG"
      - name: Update inventory mirror state
        env:
          SLUG: ${{ inputs.server_slug || 'roanoke-season-3' }}
        run: |
          python scripts/mark_discord_projection.py "$SLUG"
          python scripts/audit_inventory.py
      - name: Commit generated projection
        run: |
          git config user.name "bfdm-model-access-bot"
          git config user.email "actions@users.noreply.github.com"
          git add model/ bfdm_inventory.jsonl
          git diff --cached --quiet && exit 0
          git commit -m "build: refresh model-readable Discord projection"
          git push
