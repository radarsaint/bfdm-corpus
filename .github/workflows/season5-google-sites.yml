name: Harvest Season 5 Google Sites

on:
  push:
    branches:
      - ingest/season-5-google-sites
    paths:
      - ".github/workflows/season5-google-sites.yml"
      - "ingest/google_sites/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out ingest branch
        uses: actions/checkout@v4
        with:
          ref: ingest/season-5-google-sites
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scraper dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Harvest Season 5 Google Sites
        run: python ingest/google_sites/harvest_google_sites.py

      - name: Commit captured source snapshots
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "bfdm-corpus-bot"
          git config user.email "actions@users.noreply.github.com"
          git add sources/roanoke-s5-legends/google-sites ingest/reports/2026-10-04-season5-google-sites.*
          if git diff --cached --quiet; then
            echo "No harvest changes to commit."
            exit 0
          fi
          git commit -m "Archive Season 5 Google Sites"
          git push origin HEAD:ingest/season-5-google-sites
