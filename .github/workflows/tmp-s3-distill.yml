name: Temporary S3 Distill Extract

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout corpus
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch only the SQLite LFS object
        shell: bash
        run: |
          git lfs pull --include="discord/roanoke-season-3/roanoke-season-3.sqlite" --exclude=""

      - name: Verify database
        shell: bash
        run: |
          ls -lh discord/roanoke-season-3/roanoke-season-3.sqlite
          python - <<'PY'
          from pathlib import Path
          p=Path("discord/roanoke-season-3/roanoke-season-3.sqlite")
          b=p.read_bytes()[:16]
          if b != b"SQLite format 3\x00":
              raise SystemExit(f"Database not materialized from LFS; header={b!r}")
          print("SQLite database materialized.")
          PY

      - name: Run temporary extractor
        run: python analysis/s3_compare_extract.py

      - name: Package output and database
        run: |
          tar -czf s3-distill-output.tar.gz analysis-output
          tar -czf roanoke-s3-db.tar.gz discord/roanoke-season-3/roanoke-season-3.sqlite

      - name: Upload analysis artifact
        uses: actions/upload-artifact@v4
        with:
          name: s3-distill-output
          path: s3-distill-output.tar.gz
          retention-days: 7

      - name: Upload private SQLite artifact
        uses: actions/upload-artifact@v4
        with:
          name: roanoke-s3-db
          path: roanoke-s3-db.tar.gz
          retention-days: 1
