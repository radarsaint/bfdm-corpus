name: Temporary S3 Distill Extract

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout corpus with LFS
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Verify database
        shell: bash
        run: |
          ls -lh discord/roanoke-season-3/roanoke-season-3.sqlite
          python - <<'PY'
          from pathlib import Path
          p=Path("discord/roanoke-season-3/roanoke-season-3.sqlite")
          b=p.read_bytes()[:16]
          if b != b"SQLite format 3\x00":
              raise SystemExit(f"Database not materialized from LFS; header={b!r}")
          print("SQLite database materialized.")
          PY

      - name: Run temporary extractor
        shell: bash
        run: |
          git show origin/analysis/s3-distill:analysis/s3_compare_extract.py > /tmp/s3_compare_extract.py
          python /tmp/s3_compare_extract.py

      - name: Package output
        run: tar -czf s3-distill-output.tar.gz analysis-output

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: s3-distill-output
          path: s3-distill-output.tar.gz
          retention-days: 7
